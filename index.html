<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibbon Acara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas { touch-action: none; } /* Mencegah layar bergeser saat menggeser foto di HP */
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-2 text-gray-800">Pasang Twibbon</h1>
        <p class="text-gray-500 mb-6 text-sm">Unggah foto Anda, sesuaikan posisi, lalu unduh!</p>

        <!-- Input Foto User Saja -->
        <div class="mb-6">
            <label class="block w-full cursor-pointer bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 py-3 rounded-lg font-semibold transition">
                <span>📸 Pilih Foto Anda</span>
                <input type="file" id="upload-photo" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Area Hasil Twibbon -->
        <div class="relative bg-gray-200 rounded-lg overflow-hidden border border-gray-300 mx-auto shadow-inner" style="width: 300px; height: 300px;">
            <canvas id="canvas" width="1080" height="1080" class="w-full h-full cursor-move"></canvas>
            <div id="loading-text" class="absolute inset-0 flex items-center justify-center text-gray-400 font-medium px-4 text-sm">
                Menunggu Anda memilih foto...
            </div>
        </div>

        <!-- Kontrol Zoom Foto -->
        <div class="mt-6 mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Geser untuk Atur Ukuran Foto</label>
            <input type="range" id="zoom-slider" min="0.1" max="3" step="0.01" value="1" class="w-full cursor-pointer">
        </div>

        <!-- Tombol Download -->
        <button id="download-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition shadow-md hidden">
            ⬇️ Unduh Hasil Twibbon
        </button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const uploadPhoto = document.getElementById('upload-photo');
        const zoomSlider = document.getElementById('zoom-slider');
        const downloadBtn = document.getElementById('download-btn');
        const loadingText = document.getElementById('loading-text');

        // --- NAMA FILE BINGKAI ANDA ---
        // Sistem akan otomatis mencari gambar bernama "twibbon.png" di repositori Anda
        const frameUrl = 'twibbon.png'; 
        
        let userImg = new Image();
        let frameImg = new Image();
        
        let posX = 0, posY = 0;
        let scale = 1;
        let isDragging = false;
        let startX, startY;

        // Proses memuat bingkai otomatis
        frameImg.src = frameUrl;
        frameImg.onload = draw;
        frameImg.onerror = () => {
            loadingText.innerHTML = "<span class='text-red-500'>Error: File bingkai 'twibbon.png' belum diunggah ke GitHub!</span>";
        };

        // Proses saat user memilih foto
        uploadPhoto.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                userImg.src = event.target.result;
                userImg.onload = () => {
                    // Atur ukuran dasar foto agar pas di tengah
                    scale = Math.max(1080 / userImg.width, 1080 / userImg.height);
                    zoomSlider.value = scale;
                    posX = (1080 - userImg.width * scale) / 2;
                    posY = (1080 - userImg.height * scale) / 2;
                    
                    loadingText.style.display = 'none';
                    downloadBtn.classList.remove('hidden');
                    draw();
                }
            };
            reader.readAsDataURL(file);
        });

        // Menggabungkan foto user dan bingkai
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Gambar foto user (di belakang)
            if (userImg.src) {
                ctx.drawImage(userImg, posX, posY, userImg.width * scale, userImg.height * scale);
            }
            
            // 2. Gambar bingkai twibbon (di depan)
            if (frameImg.complete && frameImg.naturalWidth !== 0) {
                ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
            }
        }

        // --- SISTEM GESER FOTO (TOUCH & MOUSE) ---
        function getPos(e) {
            if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function startDrag(e) {
            if (!userImg.src) return;
            isDragging = true;
            const pos = getPos(e);
            startX = pos.x;
            startY = pos.y;
        }

        function doDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); // Cegah layar hp terscroll saat menggeser foto
            const pos = getPos(e);
            const ratio = 1080 / 300; // Skala ukuran asli vs ukuran tampilan di HP
            
            posX += (pos.x - startX) * ratio;
            posY += (pos.y - startY) * ratio;
            startX = pos.x;
            startY = pos.y;
            draw();
        }

        function endDrag() {
            isDragging = false;
        }

        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', endDrag);
        
        canvas.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('touchmove', doDrag, {passive: false});
        window.addEventListener('touchend', endDrag);

        // Sistem Zoom
        zoomSlider.addEventListener('input', (e) => {
            scale = parseFloat(e.target.value);
            draw();
        });

        // Sistem Download
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'Twibbon-Acara.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
